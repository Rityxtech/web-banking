  <!-- Standard Meta Description -->
  <meta name="description" content="Experience secure, seamless, and intelligent banking with Veltrix Bank. Manage your finances, transfer funds globally, invest, and grow your wealth — anytime, anywhere." />

  <script>
    try {
      const siteName = localStorage.getItem('site_name');
      const siteLogo = localStorage.getItem('site_logo');
      const currentUrl = window.location.origin;

      if (siteName) {
        document.title = siteName + ' — Secure Online Banking';

        const updateMeta = (selector, attr, value) => {
          const el = document.querySelector(selector);
          if (el) el.setAttribute(attr, value);
        };

        updateMeta('meta[property="og:title"]', 'content', siteName + ' — Secure Online Banking');
        updateMeta('meta[property="og:site_name"]', 'content', siteName);
        updateMeta('meta[name="twitter:title"]', 'content', siteName + ' — Secure Online Banking');

        const desc = 'Experience secure, seamless, and intelligent banking with ' + siteName + '. Manage your finances, transfer funds, invest, and grow your wealth — anytime, anywhere.';
        updateMeta('meta[property="og:description"]', 'content', desc);
        updateMeta('meta[name="twitter:description"]', 'content', desc);
        updateMeta('meta[name="description"]', 'content', desc);
      }

      if (siteLogo) {
        const updateMeta = (selector, attr, value) => {
          const el = document.querySelector(selector);
          if (el) el.setAttribute(attr, value);
        };
        updateMeta('meta[property="og:image"]', 'content', siteLogo);
        updateMeta('meta[name="twitter:image"]', 'content', siteLogo);
      }

      const updateMeta = (selector, attr, value) => {
        const el = document.querySelector(selector);
        if (el) el.setAttribute(attr, value);
      };
      updateMeta('meta[property="og:url"]', 'content', currentUrl);
    } catch {}
  </script>
